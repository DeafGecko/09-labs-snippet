name: CI

on:
  push:
  pull_request:
  schedule:
    # Four runs a day (00:00, 06:00, 12:00, 18:00 Central), offset per project.
    - cron: '4 0,6,12,18 * * *'

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Debug install inputs
        run: |
          git log -1 --oneline
          npm -v
          sha256sum package.json package-lock.json
          grep -c vite package.json || true
          grep -n '"node_modules/vite"' package-lock.json || echo "no node_modules/vite entry in lock"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: Production build
        run: npm run build

      # The browser tests use Chrome, which GitHub's Ubuntu runners include.
      - name: Browser and accessibility tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
